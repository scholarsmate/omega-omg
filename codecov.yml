codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: 70..100
  status:
    project:
      default:
        target: 85%
        threshold: 1%
        only_pulls: false
    patch:
      default:
        target: 80%
        threshold: 1%

ignore:
  - "tests/**"
  - "demo/**"
