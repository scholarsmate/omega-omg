name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy dsl
      - name: Test
        run: pytest --cov --maxfail=1 -q
      - name: Generate coverage.xml
        run: |
          python -m coverage xml -o coverage.xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  demo_cli:
    name: Demo CLI Integration
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install libomp (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run omg.py demo CLI
        run: |
          python omg.py --show-stats --show-timing --output matches.json demo/demo.omg demo/CIA_Briefings_of_Presidential_Candidates_1952-1992.txt
      - name: Verify matches.json exists
        run: >
          python -c "import os; p='matches.json';
          assert os.path.exists(p), f'{p} not found';
          print(f'{{p}} size: {{os.path.getsize(p)}}')"
      - name: Run highlighter.py demo CLI
        run: |
          python highlighter.py demo/CIA_Briefings_of_Presidential_Candidates_1952-1992.txt matches.json CIA_demo.html
      - name: Verify CIA_demo.html exists
        run: >
          python -c "import os; p='CIA_demo.html';
          assert os.path.exists(p), f'{p} not found';
          print(f'{{p}} size: {{os.path.getsize(p)}}')"
